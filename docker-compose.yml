services:
  postgres:
    image: postgres:15
    container_name: lms-postgres
    # A disconnected/cancelled request must not retain a transaction forever. Without this
    # guard, enough abandoned API requests can consume every Postgres connection.
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - proxy

  # Connection pooler between the app and Postgres. The app opens cheap connections to pgbouncer
  # (NullPool — a fresh one per request, see src/config.py) and pgbouncer multiplexes them onto a
  # small, bounded set of real Postgres connections. This removes the per-worker SQLAlchemy pool
  # exhaustion ("QueuePool limit ... connection timed out") that was timing requests out at 30s
  # while the server still had spare connections, and keeps total real connections under Postgres's
  # max_connections=100. Transaction pooling is safe here: the app uses psycopg2 (no server-side
  # prepared statements) and no advisory locks / LISTEN-NOTIFY.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: lms-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: myuser
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: lms_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      # Postgres allows 100 total connections. Keep a firm 65-connection ceiling here so
      # direct CRM/admin clients, maintenance, and Postgres's reserved slots retain headroom.
      DEFAULT_POOL_SIZE: "60"
      MIN_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "5"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "65"
      # Fail fast instead of keeping HTTP requests and file descriptors open for two minutes.
      QUERY_WAIT_TIMEOUT: "15"
      SERVER_IDLE_TIMEOUT: "60"
      IDLE_TRANSACTION_TIMEOUT: "60"
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: myuser
      STATS_USERS: myuser
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      LISTEN_PORT: "6432"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - proxy

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    image: lms-backend:latest
    container_name: lms-backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      # Runtime traffic goes through pgbouncer (POSTGRES_URL), but `alembic upgrade head` in
      # start.sh must hit Postgres directly — pgbouncer's transaction pooling breaks
      # CREATE INDEX CONCURRENTLY and other non-transactional DDL.
      - MIGRATION_DATABASE_URL=postgresql://myuser:${POSTGRES_PASSWORD}@postgres:5432/lms_db
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_IDS=${TELEGRAM_ADMIN_CHAT_IDS}
      - FRONTEND_URL=${FRONTEND_URL}
      - MASTEREDU_API_KEY=${MASTEREDU_API_KEY}
      - IELTS_API_KEY=${IELTS_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_MAIL_DOMAIN=${RESEND_MAIL_DOMAIN}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_SENDER_NAME=${EMAIL_SENDER_NAME}
      - LMS_URL=${LMS_URL}
      - SENDER_NAME=${SENDER_NAME}
      - DISABLE_SCHEDULER=false
      - ENABLE_LESSON_REMINDER_IN_API=false
      - VIRTUAL_HOST=lmsapi.mastereducation.kz
      - LETSENCRYPT_HOST=lmsapi.mastereducation.kz
      - VIRTUAL_PORT=8000
      - CLIENT_MAX_BODY_SIZE=50m
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_DEFAULT_TTL_SECONDS=${CACHE_DEFAULT_TTL_SECONDS:-60}
      # File storage (S3). Leave STORAGE_BACKEND=local to keep using the disk mount.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - S3_PUBLIC_OBJECTS=${S3_PUBLIC_OBJECTS:-false}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - S3_USE_ACL=${S3_USE_ACL:-false}
    depends_on:
      - postgres
      - redis
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./scripts:/app/scripts:ro
      - ./backups:/app/backups
      - ./logs:/app/logs
      # Handoff signing key (Platform Integration Pack §3); read via HANDOFF_PRIVATE_KEY_PATH.
      - ./secrets/handoff_private.pem:/run/secrets/handoff_private.pem:ro
    expose:
      - "8000"

  scheduler:
    # Reuse the exact image built for the backend so code never drifts between the
    # two containers (they share the same Dockerfile/source).
    image: lms-backend:latest
    container_name: lms-scheduler
    env_file:
      - .env
    environment:
      - POSTGRES_URL=${POSTGRES_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_SENDER_NAME=${EMAIL_SENDER_NAME}
      - LMS_URL=${LMS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      # File storage (S3) — the video ingest worker uploads HLS output here.
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - S3_USE_ACL=${S3_USE_ACL:-false}
      # Video ingest worker (YouTube -> HLS). Runs only here, not in the API container.
      - ENABLE_VIDEO_INGEST=${ENABLE_VIDEO_INGEST:-true}
      - VIDEO_INGEST_POLL=${VIDEO_INGEST_POLL:-15}
      # Redis: the platform nightly job persists its last-run date here (so a restart after
      # 03:30 Almaty does not rerun it) and the IELTS batch-scores cache applies to it too.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    command: python -m src.services.run_scheduler
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - proxy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  proxy:
    external: true
