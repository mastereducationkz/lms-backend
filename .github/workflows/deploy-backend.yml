name: Deploy Backend to Azure VM

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

concurrency:
  group: deploy-backend
  # Never cancel a running deploy: a merge fires Backend CI twice (branch + main) and the second
  # workflow_run used to cancel the first mid-deploy, leaving the container created but stopped
  # (prod down ~3 min on 2026-09-05). Queue instead.
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout tested backend revision
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Package backend
      run: tar -czf "${{ runner.temp }}/lms-backend.tar.gz" --exclude=.git --exclude=.env .

    - name: Build backend image
      run: docker build --tag lms-backend:latest .

    - name: Package backend image
      run: docker save lms-backend:latest | gzip > "${{ runner.temp }}/lms-backend-image.tar.gz"

    - name: Upload backend to Azure VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ${{ runner.temp }}/lms-backend.tar.gz,${{ runner.temp }}/lms-backend-image.tar.gz
        target: /tmp

    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "🚀 Starting backend deployment..."
          cd ~/projects/lms
          tar -xzf /tmp/lms-backend.tar.gz
          rm -f /tmp/lms-backend.tar.gz
          docker image prune -f
          gunzip -c /tmp/lms-backend-image.tar.gz | docker load
          rm -f /tmp/lms-backend-image.tar.gz
          docker image inspect lms-backend:latest >/dev/null
          
          echo "📝 Setting script permissions..."
          chmod +x scripts/*.sh scripts/*.py || true
          
          echo "📦 Creating required directories..."
          mkdir -p backups logs
          
          echo "🐳 Building and starting Docker containers..."
          # No `compose pull`: it fetches new upstream digests for postgres/redis
          # and `up -d` then RECREATES the database mid-deploy (2026-07-17 this
          # caused a ~2 min full outage). Infra containers are updated manually;
          # a deploy only rebuilds and restarts the app services.
          docker compose config -q
          docker compose up -d --no-build backend scheduler
          
          echo "✅ Backend deployment completed!"

    - name: Health Check
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "🏥 Performing health check..."
          cd ~/projects/lms
          for i in {1..20}; do
            if curl -fsS https://lmsapi.mastereducation.kz/health >/dev/null 2>&1; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Waiting for backend to be healthy ($i/20)..."
            sleep 5
          done
          echo "❌ Health check failed, dumping logs:"
          docker compose logs --tail=200 backend || true
          exit 1